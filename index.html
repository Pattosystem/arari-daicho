<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--surface2:#F5F7F6;--ink:#16211F;--muted:#5B6B68;--line:#D3DBD8;
  --accent:#0E6E5C;--accent-soft:#DCEFEA;--buy:#36449A;--buy-soft:#E4E7F6;
  --warn:#B3261E;--warn-soft:#F9E3E0;--est:#855C00;--est-soft:#F5ECD4;
  --bar:#1B2826;--bar-ink:#E6EEEB;--bar-muted:#9FB3AE;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101816;--surface:#17221F;--surface2:#1C2926;--ink:#E3ECE9;--muted:#95A8A3;--line:#2B3B37;
    --accent:#4EC2A5;--accent-soft:#173A33;--buy:#98A3F2;--buy-soft:#232A4A;
    --warn:#FF8F85;--warn-soft:#3F1F1C;--est:#E7BE5C;--est-soft:#3A2F14;
    --bar:#0C1311;--bar-ink:#E3ECE9;--bar-muted:#8CA09B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101816;--surface:#17221F;--surface2:#1C2926;--ink:#E3ECE9;--muted:#95A8A3;--line:#2B3B37;
  --accent:#4EC2A5;--accent-soft:#173A33;--buy:#98A3F2;--buy-soft:#232A4A;
  --warn:#FF8F85;--warn-soft:#3F1F1C;--est:#E7BE5C;--est-soft:#3A2F14;
  --bar:#0C1311;--bar-ink:#E3ECE9;--bar-muted:#8CA09B;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.65}
.n{font-family:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans",sans-serif;text-align:right;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.35}
h2{font-size:1.05rem}
h3{font-size:.95rem}
p{margin:.3rem 0}
a{color:var(--accent)}

header.top{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:1.25rem;padding:0 1rem;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.1rem;padding:.7rem 0;letter-spacing:.04em}
#tabs{display:flex;gap:.1rem;overflow-x:auto;flex:1;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--bar-muted);padding:.8rem .8rem .7rem;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;position:relative}
.tab:hover{color:var(--bar-ink)}
.tab.on{color:var(--bar-ink);border-bottom-color:var(--accent)}
.dot{display:inline-block;min-width:1.3em;padding:0 .35em;margin-left:.35em;border-radius:1em;background:var(--warn);color:#fff;font-size:.72rem;line-height:1.35em;text-align:center}
#storeBadge{font-size:.8rem;color:var(--bar-muted);white-space:nowrap}

main{max-width:1240px;margin:0 auto;padding:1.25rem 1rem 4rem}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);padding:.6rem .9rem;border-radius:6px;margin:1rem auto 0;max-width:1208px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.card > h2{margin-bottom:.7rem}
.hint{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.7rem}
.spread h2{margin:0}

.btn{border:1px solid var(--line);background:var(--surface);padding:.45rem .9rem;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#07130F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#07130F}}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:.2rem .55rem;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
.actions.left{justify-content:flex-start}

input[type=text],input[type=number],input[type=date],input[type=password],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:.4rem .55rem;min-width:0;width:100%}
textarea{font-family:"BIZ UDGothic",monospace;font-size:.85rem}
.field{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--muted)}
.field > span{white-space:nowrap}
.req{color:var(--warn);font-weight:400;font-size:.75rem;margin-left:.3em}
.grid{display:grid;gap:.7rem 1rem}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--surface2);font-weight:700;color:var(--muted);font-size:.8rem;white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.n,td.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
td.name{min-width:14rem}
.sub{display:block;color:var(--muted);font-size:.78rem}
.tag{display:inline-block;padding:0 .45em;border-radius:4px;font-size:.75rem;line-height:1.6;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.est{background:var(--est-soft);color:var(--est)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.buy{background:var(--buy-soft);color:var(--buy)}
.low{color:var(--warn);font-weight:700}
.neg{color:var(--warn)}

/* 期間 */
.period{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:1.1rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:.4rem .8rem;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.range{display:flex;align-items:center;gap:.4rem}
.range input{width:auto}

/* 粗利の式 */
.eq{display:flex;align-items:flex-end;gap:.4rem 1.4rem;flex-wrap:wrap;padding:.4rem 0 1rem;border-bottom:2px solid var(--ink);margin-bottom:.8rem}
.term .l{font-size:.85rem;color:var(--muted)}
.term .v{font-size:clamp(1.7rem,4.2vw,2.9rem);font-weight:700;line-height:1.1;text-align:left}
.term.gp .v{color:var(--accent)}
.term.gp .v.neg{color:var(--warn)}
.term .rate{display:inline-block;margin-left:.4rem;font-weight:700;color:var(--ink)}
.op{font-size:clamp(1.4rem,3vw,2.2rem);color:var(--muted);line-height:1.2;padding-bottom:.1rem}
.notes{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1.2rem}
.note{font-size:.88rem;padding:.35rem .7rem;border-left:3px solid var(--line);background:var(--surface)}
.note.warn{border-color:var(--warn)}
.note.est{border-color:var(--est)}
.chartbox{position:relative;height:280px}

/* 取込 */
.drop{display:block;width:100%;border:2px dashed var(--line);border-radius:8px;padding:1.6rem;text-align:center;background:var(--surface2);cursor:pointer;line-height:1.7}
.drop strong{display:inline-block;margin-bottom:.2rem}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.stat{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.6rem 0}
.stat b{font-size:1.2rem}

/* 仕入伝票 */
table.lines td{padding:.3rem .35rem}
table.lines input{padding:.3rem .45rem}
table.lines .w-qty{width:6rem}
table.lines .w-price{width:9rem}
.vtotal{display:flex;gap:1.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.6rem;font-size:.9rem}
.vtotal b{font-size:1.05rem}
details.card > summary{cursor:pointer;font-weight:700}
details.card[open] > summary{margin-bottom:.7rem}

/* 比較 */
.cmp{border-top:1px solid var(--line);padding:.9rem 0}
.cmp:first-of-type{border-top:0}
.cmp-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:baseline;margin-bottom:.5rem}
.barcell{width:30%;min-width:120px}
.plines{display:flex;flex-direction:column;gap:.6rem}
.pline{border:1px solid var(--line);border-radius:6px;padding:.6rem .75rem;background:var(--surface2)}
.pl-head{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.45rem;font-weight:700}
.pl-sku{font-weight:400;color:var(--muted);font-size:.85rem}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:.5rem .7rem;align-items:end}
.pl-grid .pl-prod{grid-column:1/-1}
.pl-grid input{background:var(--surface)}
.pl-uc{font-size:1.05rem;color:var(--ink);text-align:left;padding:.35rem 0}
.bar{height:.55rem;border-radius:3px;background:var(--buy);opacity:.75}
.bar.best{background:var(--accent);opacity:1}

/* モーダル */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow-y:auto}
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.5)}
.dialog{position:relative;background:var(--surface);border-radius:10px;padding:1.3rem 1.4rem;width:100%;max-width:520px;border:1px solid var(--line)}
.dialog.wide{max-width:980px}
.dialog .x{position:absolute;right:.8rem;top:.7rem;background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--muted)}
.dialog section{margin-top:1.1rem}
.dialog section h3{margin-bottom:.4rem}
.confirm-msg{white-space:pre-wrap}

#toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.4rem;align-items:center;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:6px;font-size:.9rem}
.toast.err{background:var(--warn);color:#fff}

pre.sql{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:.7rem;font-size:.78rem;overflow-x:auto;max-height:260px;font-family:"BIZ UDGothic",monospace}
.radio{display:flex;gap:.5rem;align-items:flex-start;margin:.35rem 0;cursor:pointer}
.radio input{margin-top:.35rem}
.empty h2{margin-bottom:.4rem}

@media (max-width:640px){
  main{padding:1rem .7rem 4rem}
  .card{padding:.9rem .85rem}
  .eq{gap:.2rem .8rem}
  .range{width:100%}
  .range input{flex:1}
  #storeBadge{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===== 社内サーバー（GitHub Pages＋Supabase）で使うときの設定 =====
   Supabaseの Project Settings → API にある値を入れてください。
   空のままなら、このブラウザの中に保存する形で動きます。 */
var APP_CONFIG={
  supabaseUrl:'https://cxdlcmrqbzjbesqqydwa.supabase.co',
  supabaseAnonKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4ZGxjbXJxYnpqYmVzcXF5ZHdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MjU2MjQsImV4cCI6MjEwNTEwMTYyNH0.Ob00GpzNuBszkzGymNMzUDGbxTjSclzLm_17AEfkYyo',
  pdfFunction:'read-invoice'
};
</script>
<script>
'use strict';
/* ========== 基本 ========== */
const TABLES=['products','suppliers','purchases','sales','codemap','batches','sets','supitems','rates'];
const DB={};TABLES.forEach(t=>DB[t]=[]);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULT_SETTINGS={costMethod:'latest',salesTaxIncluded:false,taxRate:10,lowMargin:15,backend:'local',sbUrl:'',sbKey:'',saleMapping:null,fx:{KRW:0.108,USD:150,EUR:162,GBP:190}};
let settings=Object.assign({},DEFAULT_SETTINGS,LS.get('arari:settings',{}));
settings.fx=Object.assign({},DEFAULT_SETTINGS.fx,settings.fx||{});
if(!settings.costV2){settings.costMethod='latest';settings.costV2=true;try{localStorage.setItem('arari:settings',JSON.stringify(settings))}catch(e){}}
const saveSettings=()=>LS.set('arari:settings',settings);

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>(n==null||!isFinite(n))?'—':(n<0?'−¥':'¥')+Math.round(Math.abs(n)).toLocaleString('ja-JP');
const num=(n,d=0)=>(n==null||!isFinite(n))?'—':Number(n).toLocaleString('ja-JP',{maximumFractionDigits:d});
const pct=r=>(r==null||!isFinite(r))?'—':(r*100).toFixed(1)+'%';
function toHalf(s){return String(s).replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ')}
function parseNum(v){if(v==null)return NaN;let s=toHalf(v).replace(/[¥￥,円\s]/g,'').replace(/^\((.*)\)$/,'-$1').replace(/^▲/,'-');if(s===''||s==='-')return NaN;return Number(s)}
function parseDate(v){const s=toHalf(v||'').trim();let m=s.match(/(\d{4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);if(!m)m=s.match(/^(\d{4})(\d{2})(\d{2})/);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function monthRange(off){const n=new Date();return [isoLocal(new Date(n.getFullYear(),n.getMonth()+off,1)),isoLocal(new Date(n.getFullYear(),n.getMonth()+off+1,0))]}
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

/* ========== 保存先 ========== */
const LocalBackend={
  db:null,name:'この端末',
  open(){return new Promise((res,rej)=>{if(this.db)return res();if(!window.indexedDB)return rej(new Error('IndexedDBが使えません'));const r=indexedDB.open('arari-daicho',4);r.onupgradeneeded=()=>{TABLES.forEach(t=>{if(!r.result.objectStoreNames.contains(t))r.result.createObjectStore(t,{keyPath:'id'})})};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error||new Error('開けません'))})},
  async loadAll(){await this.open();const out={};for(const t of TABLES){out[t]=await new Promise((res,rej)=>{const q=this.db.transaction(t).objectStore(t).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}return out},
  put(t,rows){return new Promise((res,rej)=>{const tx=this.db.transaction(t,'readwrite');const st=tx.objectStore(t);rows.forEach(r=>st.put(r));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  del(t,ids){return new Promise((res,rej)=>{const tx=this.db.transaction(t,'readwrite');const st=tx.objectStore(t);ids.forEach(i=>st.delete(i));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  async clear(){await this.open();for(const t of TABLES){await new Promise((res,rej)=>{const tx=this.db.transaction(t,'readwrite');tx.objectStore(t).clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}}
};
const RemoteBackend={
  client:null,name:'Supabase',
  init(url,key,persist){this.client=window.supabase.createClient(url,key,{auth:{persistSession:!!persist,autoRefreshToken:!!persist}})},
  async loadAll(){const out={};for(const t of TABLES){const rows=[];for(let from=0;;from+=1000){const{data,error}=await this.client.from('arari_'+t).select('id,data').order('id').range(from,from+999);if(error)throw new Error(error.message);rows.push(...data.map(d=>d.data));if(data.length<1000)break}out[t]=rows}return out},
  async put(t,rows){for(let i=0;i<rows.length;i+=500){const chunk=rows.slice(i,i+500).map(r=>({id:r.id,data:r,updated_at:new Date().toISOString()}));const{error}=await this.client.from('arari_'+t).upsert(chunk);if(error)throw new Error(error.message)}},
  async del(t,ids){for(let i=0;i<ids.length;i+=200){const{error}=await this.client.from('arari_'+t).delete().in('id',ids.slice(i,i+200));if(error)throw new Error(error.message)}},
  async clear(){for(const t of TABLES){const{error}=await this.client.from('arari_'+t).delete().neq('id','');if(error)throw new Error(error.message)}}
};
const MemoryBackend={name:'保存なし',async loadAll(){return{}},async put(){},async del(){},async clear(){}};
let backend=MemoryBackend,backendError=null;

let authUser=null;
const SERVER_MODE=!!(APP_CONFIG.supabaseUrl&&APP_CONFIG.supabaseAnonKey);
async function initBackend(){
  backendError=null;
  if(SERVER_MODE){backend=RemoteBackend;return}
  if(settings.backend==='supabase'){
    try{
      if(!window.supabase)throw new Error('Supabaseのライブラリを読み込めませんでした');
      if(!settings.sbUrl||!settings.sbKey)throw new Error('SupabaseのURLとanon keyが未設定です');
      RemoteBackend.init(settings.sbUrl,settings.sbKey);backend=RemoteBackend;return;
    }catch(e){backendError='Supabaseに接続できないため、この端末に保存しています：'+e.message}
  }
  try{await LocalBackend.open();backend=LocalBackend}
  catch(e){backend=MemoryBackend;backendError='データを保存できない環境です。ページを閉じると消えます（'+e.message+'）'}
}
async function loadAll(){
  try{const d=await backend.loadAll();TABLES.forEach(t=>DB[t]=d[t]||[])}
  catch(e){backendError='データを読み込めません：'+e.message+'。設定の保存先を確認してください。'}
  invalidate();
}
async function save(t,rows){
  rows=[].concat(rows);if(!rows.length)return;
  rows=[...new Map(rows.map(r=>[r.id,r])).values()];// 同じIDが1回の保存に2回入るとSupabaseが受け付けないため、後のものだけ残す
  const map=new Map(DB[t].map(r=>[r.id,r]));rows.forEach(r=>map.set(r.id,r));DB[t]=[...map.values()];invalidate();
  try{await backend.put(t,rows)}catch(e){toast('保存できませんでした：'+e.message,'err');throw e}
}
async function removeRows(t,ids){
  ids=[].concat(ids);if(!ids.length)return;const set=new Set(ids);DB[t]=DB[t].filter(r=>!set.has(r.id));invalidate();
  try{await backend.del(t,ids)}catch(e){toast('削除できませんでした：'+e.message,'err');throw e}
}

/* ========== UI共通 ========== */

/* ========== 原価計算 ========== */
let rateIdx=null,rateSrc=null;
function rateEntry(cur,date){
  cur=String(cur||'JPY').toUpperCase();if(cur==='JPY')return{rate:1,from:''};
  if(rateSrc!==DB.rates){rateSrc=DB.rates;rateIdx=new Map();DB.rates.forEach(r=>{if(!(Number(r.rate)>0))return;const a=rateIdx.get(r.currency)||[];a.push(r);rateIdx.set(r.currency,a)});rateIdx.forEach(a=>a.sort((x,y)=>y.from.localeCompare(x.from)))}
  const a=rateIdx.get(cur);if(!a||!date)return null;
  return a.find(r=>r.from<=date)||null;
}
const rateFor=(cur,date)=>{const e=rateEntry(cur,date);return e?Number(e.rate):null};
function fxOf(p){const cur=String(p.currency||'JPY').toUpperCase();if(cur==='JPY')return 1;if(p.fx_mode==='table')return rateFor(cur,p.date);return Number(p.fx)>0?Number(p.fx):null}
const unitCost=p=>{if(!p.qty)return 0;const fx=fxOf(p);if(fx==null)return NaN;return((Number(p.unit_price)||0)*fx*p.qty+(Number(p.extra_fx)||0)*fx+(Number(p.extra)||0))/p.qty};
function rateInfoHtml(cur,date){
  if(cur==='JPY')return '';
  const e=rateEntry(cur,parseDate(date)||'');
  return e?`設定のレート <b class="n">${num(e.rate,4)}</b>円（${esc(e.from)}から適用）`:`<span class="low">${esc(cur)}の${date?esc(parseDate(date)||date)+'時点の':''}レートが設定にありません</span> <button class="linkbtn" data-go="settings">設定で追加</button>`;
}
const codeKey=(code,name)=>{code=String(code||'').trim();return code?'c:'+code:'n:'+String(name||'').trim()};
let calcCache=null;
function invalidate(){calcCache=null}
function getCalc(){if(!calcCache)calcCache=compute();return calcCache}
const normName=t=>String(t||'').replace(/[\s　]+/g,' ').trim();
const saleKey=s=>s.setId?'b:'+String(s.setId).trim():String(s.code||'').trim()?'c:'+String(s.code).trim():'n:'+normName(s.name)+(s.setName?'|'+normName(s.setName):'');
const isShippingKind=k=>!!k&&!/^商品$/.test(String(k).trim());
const AUTO_NOCOST=/^値引き?$|^割引$|^クーポン|^ポイント(利用|値引)/;
function compute(){
  const cm=new Map(DB.codemap.map(m=>[m.id,m]));
  const prodById=new Map(DB.products.map(p=>[p.id,p]));
  const prodByCode=new Map();DB.products.forEach(p=>{const c=String(p.code||'').trim();if(c&&!prodByCode.has(c))prodByCode.set(c,p)});
  const setById=new Map(DB.sets.map(x=>[String(x.set_id),x]));
  const setByHinban=new Map();DB.sets.forEach(x=>{if(x.hinban&&!setByHinban.has(x.hinban))setByHinban.set(x.hinban,x)});
  const nameCount=new Map(),setByName=new Map();
  const addName=(k,x)=>{nameCount.set(k,(nameCount.get(k)||0)+1);setByName.set(k,x)};
  DB.sets.forEach(x=>{addName('ps|'+x.product_name+'|'+x.set_name,x);addName('p|'+x.product_name,x);if(x.set_name)addName('s|'+x.set_name,x)});
  const byName=k=>nameCount.get(k)===1?setByName.get(k):null;
  const fromSet=x=>(x&&x.product_id&&prodById.has(x.product_id))?{pid:x.product_id,per:Number(x.per)||1}:null;
  const resolve=s=>{
    const key=saleKey(s);
    if(isShippingKind(s.kind))return{shipping:true,key};
    if(s.setId){const st=setById.get(String(s.setId).trim());const r=fromSet(st);if(r)return Object.assign(r,{key})}
    const m=cm.get(key);
    if(m){if(m.excluded)return{excluded:true,key};if(m.nocost)return{nocost:true,key};if(prodById.has(m.product_id))return{pid:m.product_id,per:Number(m.per)||1,key}}
    const nm=normName(s.name),sn=normName(s.setName);
    if(nm){const r=fromSet(byName('ps|'+nm+'|'+sn));if(r)return Object.assign(r,{key})}
    const code=String(s.code||'').trim();
    if(code){const r=fromSet(setByHinban.get(code));if(r)return Object.assign(r,{key});if(prodByCode.has(code))return{pid:prodByCode.get(code).id,per:1,key}}
    if(!s.setId&&nm){const r=(sn?fromSet(byName('s|'+sn)):null)||fromSet(byName('p|'+nm));if(r)return Object.assign(r,{key})}
    if(AUTO_NOCOST.test(nm))return{nocost:true,auto:true,key};
    return{key};
  };
  const events=new Map();const push=(pid,e)=>{if(!events.has(pid))events.set(pid,[]);events.get(pid).push(e)};
  let noRate=0,noRateCur=new Set();for(const p of DB.purchases){if(!prodById.has(p.product_id))continue;const cost=unitCost(p);if(!isFinite(cost)){noRate++;noRateCur.add(p.currency);continue}push(p.product_id,{t:0,date:p.date,qty:Number(p.qty)||0,cost,p})}
  const saleInfo=new Map(),unmapped=new Map();
  for(const s of DB.sales){
    const r=resolve(s);
    const info={pid:r.pid||null,per:r.per||1,excluded:!!r.excluded,shipping:!!r.shipping,nocost:!!r.nocost,unit:null,status:'none'};saleInfo.set(s.id,info);
    if(info.excluded||info.shipping||info.nocost)continue;
    if(!info.pid){const u=unmapped.get(r.key)||{key:r.key,setId:s.setId||'',code:s.code,name:s.name,setName:s.setName||'',count:0,amount:0};u.count++;u.amount+=s.amount;unmapped.set(r.key,u);continue}
    push(info.pid,{t:1,date:s.date,qty:(Number(s.qty)||0)*info.per,info});
  }
  const stock=new Map();
  for(const [pid,evs] of events){
    evs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.t-b.t);
    const first=evs.find(e=>e.t===0);const firstCost=first?first.cost:null;
    const pr=prodById.get(pid);const manual=pr&&Number(pr.std_cost)>0?Number(pr.std_cost):null;
    let qty=0,avg=null,last=null;
    for(const e of evs){
      if(e.t===0){
        if(avg==null||qty<=0){avg=e.cost;qty+=e.qty}
        else{avg=(avg*qty+e.cost*e.qty)/(qty+e.qty);qty+=e.qty}
        last={cost:e.cost,date:e.date,supplier_id:e.p.supplier_id};
      }else{
        let unit=settings.costMethod==='latest'?(last&&last.cost):avg,status;
        if(unit==null){if(manual!=null){unit=manual;status='manual'}else if(firstCost!=null){unit=firstCost;status='est'}else status='none'}
        else status=(settings.costMethod==='moving'&&e.qty>0&&qty<e.qty)?'est':'ok';
        e.info.unit=unit;e.info.status=status;qty-=e.qty;
      }
    }
    stock.set(pid,{qty,avg,last});
  }
  return{saleInfo,unmapped:[...unmapped.values()].sort((a,b)=>b.amount-a.amount),stock,prodById,noRate,noRateCur:[...noRateCur]};
}
function aggregate(from,to){
  const c=getCalc();
  const A={sales:0,costedSales:0,cost:0,noneAmount:0,noneCount:0,estCount:0,unmappedAmount:0,unmappedCount:0,shipping:0,shippingCount:0,nocost:0,nocostCount:0,byProd:new Map(),byCust:new Map(),byMonth:new Map()};
  const bump=(map,key)=>{let r=map.get(key);if(!r){r={key,qty:0,lines:0,sales:0,costedSales:0,cost:0,none:0,est:0,manual:0,noneQty:0,noneSales:0};map.set(key,r)}return r};
  for(const s of DB.sales){
    if(from&&s.date<from)continue;if(to&&s.date>to)continue;
    const i=c.saleInfo.get(s.id);if(!i||i.excluded)continue;
    if(i.shipping){A.shipping+=s.amount;A.shippingCount++;continue}
    if(i.nocost){A.nocost+=s.amount;A.nocostCount++;A.sales+=s.amount;A.costedSales+=s.amount;
      [bump(A.byProd,'__nocost'),bump(A.byCust,s.customer||'（取引先名なし）'),bump(A.byMonth,s.date.slice(0,7))].forEach(r=>{r.lines++;r.sales+=s.amount;r.costedSales+=s.amount});continue}
    if(!i.pid){A.unmappedAmount+=s.amount;A.unmappedCount++;continue}
    A.sales+=s.amount;
    const tg=[bump(A.byProd,i.pid),bump(A.byCust,s.customer||'（取引先名なし）'),bump(A.byMonth,s.date.slice(0,7))];
    const q=s.qty*(i.per||1);
    tg.forEach(r=>{r.qty+=q;r.lines++;r.sales+=s.amount});
    if(i.unit==null){A.noneAmount+=s.amount;A.noneCount++;tg.forEach(r=>{r.none++;r.noneQty+=q;r.noneSales+=s.amount});continue}
    const cost=i.unit*q;A.costedSales+=s.amount;A.cost+=cost;
    if(i.status==='est'){A.estCount++;tg.forEach(r=>r.est++)}
    if(i.status==='manual'){A.manualCount=(A.manualCount||0)+1;A.manualAmount=(A.manualAmount||0)+s.amount;tg.forEach(r=>r.manual++)}
    tg.forEach(r=>{r.costedSales+=s.amount;r.cost+=cost});
  }
  const fin=r=>{r.gp=r.costedSales-r.cost;r.margin=r.costedSales?r.gp/r.costedSales:null};
  fin(A);[A.byProd,A.byCust,A.byMonth].forEach(m=>m.forEach(fin));
  return A;
}
function purchaseStats(from){
  const out=new Map();
  for(const p of DB.purchases){
    if(from&&p.date<from)continue;
    let r=out.get(p.product_id);if(!r){r={bySup:new Map(),last:null,min:null,qty:0,total:0};out.set(p.product_id,r)}
    const uc=unitCost(p),q=Number(p.qty)||0;if(!isFinite(uc))continue;
    let s=r.bySup.get(p.supplier_id);if(!s){s={sid:p.supplier_id,count:0,qty:0,total:0,min:null,last:null};r.bySup.set(p.supplier_id,s)}
    s.count++;s.qty+=q;s.total+=uc*q;if(s.min==null||uc<s.min)s.min=uc;if(!s.last||p.date>=s.last.date)s.last={cost:uc,date:p.date};
    r.qty+=q;r.total+=uc*q;
    if(!r.last||p.date>=r.last.date)r.last={cost:uc,date:p.date,sid:p.supplier_id};
    if(!r.min||uc<r.min.cost)r.min={cost:uc,sid:p.supplier_id,date:p.date};
  }
  out.forEach(r=>r.bySup.forEach(s=>s.avg=s.qty?s.total/s.qty:null));
  return out;
}

const SALE_FIELDS=[
  {k:'date',l:'日付',req:true,re:[/^(受注|注文)日時?$/,/(受注|注文|購入|売上|出荷|発送|納品)(日時|日付|日)|^日付$|date/i]},
  {k:'orderNo',l:'受注番号',re:[/^受注番号$/,/(受注|注文|伝票)\s*(番号|ID|No|コード)|order/i]},
  {k:'line',l:'受注内の行番号',re:[/受注内連番|明細番号|行番号/]},
  {k:'customer',l:'取引先（顧客）',re:[/^会社名$/,/会社名|得意先|顧客|取引先|購入者|customer/i]},
  {k:'setId',l:'BカートセットID',re:[/セット\s*ID|set_?id/i]},
  {k:'code',l:'品番',re:[/^品番$/,/品番|商品\s*(コード|番号)|SKU|型番/i]},
  {k:'name',l:'商品名',req:true,re:[/^商品名$/,/商品名|品名|product/i]},
  {k:'setName',l:'セット名',re:[/^セット名$/]},
  {k:'kind',l:'明細区分（送料の見分け）',re:[/明細区分/]},
  {k:'status',l:'対応状況（キャンセル除外）',re:[/対応状況|ステータス/]},
  {k:'qty',l:'数量',req:true,re:[/^受注数$/,/数量|個数|qty|quantity/i]},
  {k:'unit',l:'単価',re:[/^単価$/,/単価|販売価格|price/i]},
  {k:'amount',l:'金額（小計）',re:[/^小計$/,/小計|金額|amount/i]}
];
let imp=null;
async function readCsvFile(file){
  const buf=await file.arrayBuffer();let text;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){text=new TextDecoder('shift_jis').decode(buf)}
  text=text.replace(/^\uFEFF/,'');
  return Papa.parse(text,{skipEmptyLines:'greedy'}).data;
}
function guessMapping(headers){
  const h=headers.map(x=>String(x).trim());const m={};
  const saved=settings.saleMapping;
  if(saved){let ok=true;for(const f of SALE_FIELDS){const name=saved[f.k];if(name==null){m[f.k]=-1;continue}const i=h.indexOf(name);if(i<0){ok=false;break}m[f.k]=i}if(ok&&m.date>=0&&m.qty>=0)return m}
  const used=new Set();
  for(const f of SALE_FIELDS){let i=-1;for(const re of f.re){i=h.findIndex((x,idx)=>!used.has(idx)&&re.test(x));if(i>=0)break}m[f.k]=i;if(i>=0)used.add(i)}
  return m;
}
function parseSaleRow(row,m,taxDiv){
  const get=k=>m[k]>=0?row[m[k]]:'';
  const date=parseDate(get('date'));const qty=parseNum(get('qty'));
  const code=String(get('code')||'').trim(),name=normName(get('name')),setId=String(get('setId')||'').trim(),setName=normName(get('setName'));
  const kind=String(get('kind')||'').trim(),line=String(get('line')||'').trim();
  if(/キャンセル|取消|取り消し/.test(String(get('status')||'')))return{err:'キャンセルの注文'};
  if(!date)return{err:'日付が読めない'};if(!isFinite(qty)||qty===0)return{err:'数量が0か読めない'};if(!code&&!name&&!setId)return{err:'セットID・品番・商品名がない'};
  let unit=parseNum(get('unit')),amount=parseNum(get('amount'));
  if(!isFinite(amount))amount=isFinite(unit)?unit*qty:NaN;
  if(!isFinite(amount))return{err:'金額が読めない'};
  amount=amount/taxDiv;
  return{date,qty,setId,setName,code,name,kind,line,amount,unit:amount/qty,orderNo:String(get('orderNo')||'').trim(),customer:String(get('customer')||'').trim()};
}

function bindImportPanel(){
  $$('[data-map]').forEach(s=>s.onchange=()=>{imp.mapping[s.dataset.map]=Number(s.value);render()});
  $$('input[name="taxin"]').forEach(r=>r.onchange=()=>{settings.salesTaxIncluded=r.value==='1';saveSettings();render()});
  $('#impCancel').onclick=()=>{imp=null;render()};
  $('#impGo').onclick=doSalesImport;
}
async function doSalesImport(){
  const m=imp.mapping;
  if(m.date<0||m.qty<0){toast('日付と数量の列を選んでください','err');return}
  if(m.code<0&&m.name<0&&m.setId<0){toast('商品名・品番・セットIDのどれかの列を選んでください','err');return}
  if(m.unit<0&&m.amount<0){toast('単価か金額の列を選んでください','err');return}
  const taxDiv=settings.salesTaxIncluded?1+settings.taxRate/100:1;
  const batchId=uid(),occ=new Map(),out=[];let skipped=0,minD=null,maxD=null;
  for(const row of imp.rows){
    const p=parseSaleRow(row,m,taxDiv);if(p.err){skipped++;continue}
    const base=p.orderNo?(p.line?`o|${p.orderNo}|L${p.line}`:`o|${p.orderNo}|${p.setId||p.code||p.name}|${p.setName}`):`r|${p.date}|${p.setId}|${p.code}|${p.name}|${p.setName}|${p.qty}|${p.amount.toFixed(2)}|${p.customer}`;
    const n=(occ.get(base)||0)+1;occ.set(base,n);
    out.push(Object.assign({id:'s_'+hash(base+'|'+n),batch:batchId},p));
    if(!minD||p.date<minD)minD=p.date;if(!maxD||p.date>maxD)maxD=p.date;
  }
  const existing=new Set(DB.sales.map(s=>s.id));const updated=out.filter(o=>existing.has(o.id)).length;
  const sm={};SALE_FIELDS.forEach(f=>sm[f.k]=m[f.k]>=0?imp.headers[m[f.k]]:null);settings.saleMapping=sm;saveSettings();
  const btn=$('#impGo');btn.disabled=true;btn.textContent='取り込み中…';
  try{
    await save('batches',{id:batchId,file:imp.file,importedAt:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,19),rows:out.length,from:minD,to:maxD});
    await save('sales',out);
    imp=null;toast(`取り込みました：新規 ${out.length-updated}行・上書き ${updated}行・読み飛ばし ${skipped}行`);render();
  }catch(e){btn.disabled=false;btn.textContent='もう一度取り込む'}
}

const BC_COLS={pid:'【基本】Bカート商品ID',pname:'【基本】商品名',kanri:'【基本】商品管理番号',pstatus:'【基本】状態',sid:'【セット】BカートセットID',sname:'【セット】セット名',hin:'【セット】品番',jan:'【セット】JANコード',unit:'【セット】単位',price:'【セット】単価',sstatus:'【セット】状態'};
const VARIANT_RE=/通\s*常\s*便|納\s*期\s*優\s*先\s*便|消費期限|期限|sold\s*out|期間限定|アウトレット|訳あり|在庫限り|[~〜～]\s*\d+\s*箱|以上|会員価格/i;
const perHint=t=>{const m=String(t).match(/[xｘ×X✕]\s*(\d+)\s*箱/)||String(t).match(/(\d+)\s*vial.*(お得|まとめ|プラン)/i);const n=m?Number(m[1]):0;return n>1?n:null};
const cleanName=t=>String(t||'').replace(/[\s　]+/g,' ').trim();
let setf={q:'',only:'all'};
let bcLast=null;

async function importBcartProducts(file){
  let data;try{data=await readCsvFile(file)}catch(e){toast('CSVを読めませんでした：'+e.message,'err');return}
  const h=(data[0]||[]).map(x=>String(x).trim());const col={};
  Object.entries(BC_COLS).forEach(([k,n])=>col[k]=h.indexOf(n));
  if(col.pid<0||col.sid<0||col.pname<0){toast('Bカートの商品CSVではないようです（【セット】BカートセットID の列がありません）','err');return}
  const g=(r,k)=>col[k]>=0?String(r[col[k]]??'').trim():'';
  const existing=new Map(DB.sets.map(x=>[x.id,x]));
  const byProd=new Map();let noSet=0;const seen=new Set();
  for(const r of data.slice(1)){
    if(r.length<2)continue;
    const sid=g(r,'sid');if(!sid){if(g(r,'pid'))noSet++;continue}
    if(seen.has(sid))continue;seen.add(sid);
    const rec={id:'bc:'+sid,set_id:sid,bcart_product_id:g(r,'pid'),product_name:cleanName(g(r,'pname')),set_name:cleanName(g(r,'sname')),hinban:g(r,'hin'),jan:g(r,'jan'),kanri:g(r,'kanri'),unit:g(r,'unit'),price:parseNum(g(r,'price')),status:g(r,'sstatus'),product_status:g(r,'pstatus')};
    rec.per_hint=perHint(rec.set_name)||perHint(rec.product_name);
    if(!byProd.has(rec.bcart_product_id))byProd.set(rec.bcart_product_id,[]);
    byProd.get(rec.bcart_product_id).push(rec);
  }
  const byCode=new Map();DB.products.forEach(p=>{if(p.code&&!byCode.has(p.code))byCode.set(p.code,p)});
  const usedCodes=new Set(byCode.keys());
  const newProducts=[],out=[];let added=0,updated=0,reused=0;
  // 既存（取込前から登録済み）の商品とは品番で結び付ける。取込内では管理番号が別商品で重複していることがあるため、コードでまとめない
  const makeProduct=(name,hinban,kanri,unit)=>{
    if(hinban&&byCode.has(hinban)){reused++;return byCode.get(hinban)}
    const code=[hinban,kanri].find(c=>c&&!usedCodes.has(c))||'';
    const p={id:uid(),code,name,category:'',unit:unit||'',memo:'Bカートの商品CSVから作成'};
    if(code)usedCodes.add(code);newProducts.push(p);return p;
  };
  for(const sets of byProd.values()){
    const fresh=[];
    sets.forEach(x=>{const e=existing.get(x.id);if(e){out.push(Object.assign({},x,{product_id:e.product_id??null,per:e.per??1}));updated++}else fresh.push(x)});
    if(!fresh.length)continue;
    const single=sets.length===1;
    const variants=single?fresh:fresh.filter(x=>VARIANT_RE.test(x.set_name));
    const normals=single?[]:fresh.filter(x=>!VARIANT_RE.test(x.set_name));
    if(variants.length){
      const sib=sets.find(x=>existing.has(x.id)&&(single||VARIANT_RE.test(x.set_name))&&existing.get(x.id).product_id);
      let p=sib?DB.products.find(q=>q.id===existing.get(sib.id).product_id):null;
      if(!p){const f=variants[0];p=makeProduct(f.product_name,variants.map(v=>v.hinban).find(Boolean)||'',f.kanri,f.unit)}
      variants.forEach(x=>{out.push(Object.assign({},x,{product_id:p.id,per:1}));added++});
    }
    normals.forEach(x=>{
      const name=x.set_name&&x.set_name.includes(x.product_name)?x.set_name:x.product_name&&x.set_name&&x.product_name.includes(x.set_name)?x.product_name:`${x.product_name}／${x.set_name}`;
      const p=makeProduct(name,x.hinban,'',x.unit);out.push(Object.assign({},x,{product_id:p.id,per:1}));added++;
    });
  }
  if(!out.length){toast('取り込めるセットがありませんでした','err');return}
  await save('products',newProducts);await save('sets',out);
  bcLast={file:file.name,added,updated,products:newProducts.length,reused,noSet,hints:out.filter(x=>x.per_hint&&(x.per||1)!==x.per_hint).length};
  toast(`取り込みました：新しいセット ${added}件・更新 ${updated}件`);
  render();
}

    ${hintCount?`<div class="note est" style="margin:.6rem 0">セット名から、入数が1ではなさそうなセットが${hintCount}件あります。仕入の単位と照らして確認してください。<button class="linkbtn" id="applyHints">候補の入数をすべて反映</button></div>`:''}
    ${unlinkedCount?`<div class="note warn" style="margin:.6rem 0">仕入商品に紐付いていないセットが${unlinkedCount}件あります。このセットの売上は粗利に入りません。</div>`:''}
    ${list.length?`<div class="tablewrap"><table class="settable"><thead><tr><th>Bカートの商品／セット</th><th class="n">単価</th><th>仕入商品</th><th class="n">入数</th><th class="n">販売実績</th></tr></thead><tbody>
    ${list.slice(0,500).map(x=>{const first=x.bcart_product_id!==prevPid;prevPid=x.bcart_product_id;const sb=salesBySet.get(String(x.set_id))||salesBySet.get('n:'+normName(x.product_name)+'|'+normName(x.set_name));const sh=x.product_id?shared.get(x.product_id)||0:0;

function voucherCalc(){
  const fx=vch.currency==='JPY'?1:vch.fxMode==='manual'?(Number(vch.fx)||0):(rateFor(vch.currency,parseDate(vch.date))||0);const extra=(Number(vch.extra)||0)+(Number(vch.extraFx)||0)*fx;
  const ls=vch.lines.map(l=>{const q=Number(l.qty)||0,u=Number(l.unit)||0;return{q,amt:q*u*fx}});

/* ========== 仕入の請求書明細の取込 ========== */
const EXTRA_KIND=/送料|付帯|諸経費|手数料|shipping|freight|courier|handling/i;
const meaningfulSku=sku=>{sku=String(sku||'').trim();return sku&&!/^0+$/.test(sku)?sku:''};
const supItemId=(supplier,sku,desc)=>'si:'+hash(normName(supplier).toLowerCase()+'|'+(meaningfulSku(sku)||'d:'+normName(desc)).toLowerCase());
let pimp=null;

function parsePurchaseCsv(text,fileName){
  const data=Papa.parse(text.replace(/^\uFEFF/,''),{skipEmptyLines:'greedy'}).data;
  if(data.length<2)return{error:'データ行がありません'};
  const h=data[0].map(x=>String(x).trim());
  const ix=(...names)=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return i}return -1};
  const col={date:ix('仕入日','日付','請求日'),sup:ix('仕入先'),no:ix('伝票番号','請求書番号'),doc:ix('書類'),cur:ix('通貨'),fx:ix('レート','為替レート'),
    sku:ix('SKU','仕入先品番'),desc:ix('品名','明細'),kind:ix('区分'),qty:ix('数量'),unit:ix('単価'),tax:ix('税額'),prod:ix('仕入商品','商品コード'),per:ix('入数'),extra:ix('付帯費用')};
  const need=[['仕入日',col.date],['仕入先',col.sup],['数量',col.qty],['単価',col.unit]].filter(x=>x[1]<0).map(x=>x[0]);
  if(col.sku<0&&col.desc<0&&col.prod<0)need.push('SKU・品名・仕入商品のどれか');
  if(need.length)return{error:'見出しが足りません：'+need.join('、')};
  const smap=new Map(DB.supitems.map(x=>[x.id,x]));
  const vouchers=new Map(),errs=[];
  data.slice(1).forEach((r,i)=>{
    const line=i+2;const g=k=>col[k]>=0?String(r[col[k]]??'').trim():'';
    const date=parseDate(g('date')),supplier=normName(g('sup')),no=g('no');
    if(!date)return errs.push(`${line}行目：仕入日が読めません`);
    if(!supplier)return errs.push(`${line}行目：仕入先がありません`);
    const key=`${supplier}|${no||date}`;
    let v=vouchers.get(key);
    if(!v){const cur=(g('cur')||'JPY').toUpperCase();v={key,vid:'inv_'+hash(normName(supplier).toLowerCase()+'|'+(no||date)),date,supplier,no,doc:/プロ|pro.?forma/i.test(g('doc'))?'proforma':'invoice',currency:cur,fx:cur==='JPY'?1:(parseNum(g('fx'))||''),fxMode:parseNum(g('fx'))>0?'manual':'table',lines:[],extraFx:0,extraJpy:0};vouchers.set(key,v)}
    const qty=parseNum(g('qty')),unit=parseNum(g('unit')),tax=parseNum(g('tax'))||0;
    const sku=g('sku'),desc=normName(g('desc')),kind=g('kind');
    if(!isFinite(qty)||!isFinite(unit))return errs.push(`${line}行目：数量か単価が読めません`);
    const extraJpy=parseNum(g('extra'));if(isFinite(extraJpy))v.extraJpy+=extraJpy;
    if(EXTRA_KIND.test(kind)||(!kind&&/^shipp|shipping/i.test(sku+' '+desc))){v.extraFx+=qty*unit+tax;return}
    const si=smap.get(supItemId(supplier,sku,desc));
    let label='',per=parseNum(g('per'));
    if(si&&DB.products.some(p=>p.id===si.product_id)){label=prodLabel(DB.products.find(p=>p.id===si.product_id));if(!isFinite(per))per=si.per}
    else if(g('prod')){const p=findProduct(g('prod'));if(p)label=prodLabel(p);else label=g('prod')}
    v.lines.push({sku,desc,qty,unit,tax,label,per:isFinite(per)&&per>0?per:1,known:!!si});
  });
  const list=[...vouchers.values()].sort((a,b)=>a.date.localeCompare(b.date));
  list.forEach(v=>v.exists=DB.purchases.some(p=>p.voucher===v.vid));
  return{file:fileName,vouchers:list,errs};
}
function pimpCalc(v){
  const fx=v.currency==='JPY'?1:v.fxMode==='manual'?(Number(v.fx)||0):(rateFor(v.currency,parseDate(v.date))||0);
  const ls=v.lines.map(l=>{const q=Number(l.qty)||0,per=Number(l.per)||1;const raw=q*(Number(l.unit)||0)+(Number(l.tax)||0);return{q,per,raw,amt:raw*fx}});
  const total=ls.reduce((s,x)=>s+x.amt,0);const extra=(Number(v.extraFx)||0)*fx+(Number(v.extraJpy)||0);
  const exFx=Number(v.extraFx)||0,exJpy=Number(v.extraJpy)||0;const base=ls.reduce((s,x)=>s+x.raw,0);
  ls.forEach(x=>{const sh=base>0?x.raw/base:0;x.extFx=exFx*sh;x.extJpy=exJpy*sh;x.ext=total>0?extra*x.amt/total:0;x.uc=x.q?(x.amt+x.ext)/(x.q*x.per):null});
  const foreign=v.lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.unit)||0)+(Number(l.tax)||0),0)+(Number(v.extraFx)||0);
  return{fx,ls,total,extra,foreign};
}
const pimpTol=v=>v.currency==='JPY'?1:0.05;
function pimpCheck(v){
  const c=pimpCalc(v);const out={c,diff:null,ok:true};
  if(v.invoiceTotal!=null){out.diff=r2(c.foreign-v.invoiceTotal);if(Math.abs(out.diff)>pimpTol(v))out.ok=false}
  if(v.blockers&&v.blockers.length)out.ok=false;
  return out;
}

    if(btn){btn.disabled=false;btn.textContent=`${pimp.vouchers.length}伝票を登録する`}
    if(failed&&!await askConfirm(`請求書のPDFを保存できませんでした（${failed}）。\nSupabaseに書類の保存場所（invoices）が作られていない可能性があります。\nPDFを添付せずに登録しますか？`,'PDFなしで登録する',false))return;

    const att=attMap.has(v.vid)?attMap.get(v.vid):oldAtt;if(attMap.has(v.vid))oldAtt.forEach(a=>oldPaths.push(a.path));
    let sup=DB.suppliers.find(s=>normName(s.name).toLowerCase()===v.supplier.toLowerCase())||newSups.find(s=>s.name===v.supplier);
    if(!sup){sup={id:uid(),name:v.supplier,memo:''};newSups.push(sup)}

    DB.purchases.filter(p=>p.voucher===v.vid).forEach(p=>removeIds.push(p.id));
    v.lines.forEach((l,li)=>{const x=c.ls[li];const q=Number(l.qty),per=Number(l.per)||1;

async function pdfToTextAndImages(file){
  const maxImgOverride=aiMode==='function'?0:null;
  if(window.pdfjsLib&&!pdfjsLib.GlobalWorkerOptions.workerSrc)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[],images=[];const maxImg=maxImgOverride===0?0:(aiImages?Math.min(aiImages.maxCount||0,3):0);
  for(let n=1;n<=Math.min(doc.numPages,6);n++){
    const pg=await doc.getPage(n);const tc=await pg.getTextContent();const rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,s:it.str})});
    rows.sort((a,b)=>b.y-a.y);out.push(`[${n}ページ]`);rows.forEach(r=>out.push(r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join('\t')));
    if(n<=maxImg){try{const vp=pg.getViewport({scale:1.6});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(blob)images.push(blob)}catch(e){}}
  }
  return{text:out.join('\n').slice(0,20000),images,pages:doc.numPages};
}
function parseJsonLoose(t){
  t=String(t||'').trim();try{return JSON.parse(t)}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw{code:'invalid_json',message:'読み取り結果をJSONとして読めませんでした'};
}
async function callInvoiceFunction(prompt,file){
  if(file.size>10*1024*1024)throw{code:'too_large'};
  const buf=new Uint8Array(await file.arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  const{data}=await RemoteBackend.client.auth.getSession();const token=data&&data.session&&data.session.access_token;
  if(!token)throw{code:'login_required'};
  let r;
  try{r=await fetch(`${APP_CONFIG.supabaseUrl.replace(/\/$/,'')}/functions/v1/${APP_CONFIG.pdfFunction}`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,apikey:APP_CONFIG.supabaseAnonKey},body:JSON.stringify({prompt,pdf:btoa(bin)})})}
  catch(e){throw{code:'network',message:e.message}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:d.error||'upstream_error',message:d.detail||('HTTP '+r.status)};
  return parseJsonLoose(d.text);
}
function buildInvoicePrompt(text,withImages){
  const sups=DB.suppliers.map(s=>s.name).filter(n=>n!=='期首在庫');
  let prods=DB.products.map((p,i)=>`${i+1}: ${prodLabel(p)}`);
  const head=`あなたは医療機器・美容医療製品の輸入商社（LIAS株式会社）の経理担当です。仕入先から届いた請求書を読み取り、JSONだけを返してください。今日は${isoLocal(new Date())}です。
${withImages==='pdf'?'請求書のPDFそのものを添付しています。下に付けた抽出テキストは補助として使い、表の読み取りはPDFを優先してください':'以下は請求書PDFから抽出したテキストです'+(withImages?'（同じ請求書のページ画像も添付しています。表の読み取りは画像も見て確認してください）':'')}。

ルール：
- 数値は請求書に書かれている通りに入れ、計算や推測で埋めない。読めない値は null。
- lines には請求書の明細を上から順にすべて入れる。商品は kind "item"、送料・運賃・配送料・手数料は "shipping"、値引きは "discount"（amountはマイナス）。
- amount はその行の金額（値引き後・税抜）。discount_pct は行の値引き率（なければ null）。
- tax_rate はその行の税率（%の数値。"No VAT"や免税は 0、書かれていなければ null）。tax はその行の税額が明細に書かれている場合だけ入れ、なければ null。
- subtotal（税抜合計）、tax_total（税額合計）、total（請求総額）は請求書の表記どおり。
- doc_type：正式な請求書は "invoice"、プロフォーマ・見積・注文確認は "proforma"。
- supplier：請求書の発行元の会社名（請求先・宛先ではない）。「既存の仕入先」に同じ会社があれば、その表記をそのまま使う。
- invoice_no：請求書番号。date：請求書の発行日を YYYY-MM-DD。currency：通貨コード（GBP、EUR、USD、KRW、JPY）。
- product_no：kind が item の行について、「仕入商品一覧」の中から同じ商品の番号を入れる。英語名とカタカナ名の違い（例：Pluryal Densify と プルリアル デンシファイ、SUNEKOS と スネコス）は同じ商品として扱ってよい。容量・濃度・種類が明らかに違うものは選ばない。該当がなければ null。
- notes：次のどれかに当てはまる場合だけ、日本語で1項目1文で書く。当てはまらなければ空配列。
  ・正式な請求書ではない（プロフォーマ、見積など）
  ・一部の行だけに税（VATなど）がかかっている
  ・送料や運賃が含まれていない（EXWなど）、または別に請求されると書かれている
  ・値引き、返金、前払い済みの控除がある
  ・明細の数字どうしが合わない
  次のことは書かない：請求先の名義（LIAS株式会社、MEDIXOR、KOTA SAKAGUCHI、坂口孝太はすべて自社）、日付が新しいこと、全行が免税・非課税であること、送料が明細の1行として載っていること。

形式：
{"supplier":"","invoice_no":"","date":"YYYY-MM-DD","doc_type":"invoice","currency":"GBP","lines":[{"sku":"","description":"","kind":"item","qty":0,"unit_price":0,"discount_pct":null,"amount":0,"tax_rate":null,"tax":null,"product_no":null}],"subtotal":0,"tax_total":0,"total":0,"notes":[]}

既存の仕入先：
${sups.join('\n')||'（なし）'}
`;
  const tail=`
請求書のテキスト：
${text}`;
  const enc=new TextEncoder();
  let list=prods.join('\n');
  while(enc.encode(head+'\n仕入商品一覧：\n'+list+tail).length>60000&&prods.length){prods=prods.slice(0,Math.floor(prods.length*0.8));list=prods.join('\n')}
  return head+'\n仕入商品一覧：\n'+(list||'（なし）')+tail;
}
const r2=n=>Math.round(n*100)/100;
function invoiceToVoucher(j,fileName){
  const msgs=[],blockers=[];
  const cur=String(j.currency||'').toUpperCase();
  if(!CURRENCIES.includes(cur))blockers.push(`通貨「${j.currency||'不明'}」には対応していません`);
  const date=parseDate(j.date);if(!date)blockers.push('請求書の日付が読めませんでした');
  let supplier=normName(j.supplier);
  if(!supplier)blockers.push('仕入先名が読めませんでした');
  const known=DB.suppliers.find(s=>normName(s.name).toLowerCase()===supplier.toLowerCase());if(known)supplier=known.name;
  const lines=Array.isArray(j.lines)?j.lines:[];
  const num2=v=>v==null||v===''?null:Number(v);
  // 行の検算
  lines.forEach((l,i)=>{
    const q=num2(l.qty),u=num2(l.unit_price),a=num2(l.amount),d=num2(l.discount_pct)||0;
    if(a==null||!isFinite(a)){blockers.push(`${i+1}行目「${l.description||''}」の金額が読めませんでした`);return}
    if(q!=null&&u!=null&&isFinite(q)&&isFinite(u)&&Math.abs(q*u*(1-d/100)-a)>0.05)msgs.push(`${i+1}行目「${l.description||''}」：数量×単価（${num(q,2)}×${num(u,2)}）が金額 ${num(a,2)} と合いません`);
  });
  const sumAmount=r2(lines.reduce((s,l)=>s+(Number(l.amount)||0),0));
  if(j.subtotal!=null&&Math.abs(sumAmount-Number(j.subtotal))>0.05)blockers.push(`明細の合計 ${num(sumAmount,2)} が小計 ${num(j.subtotal,2)} と合いません`);
  // 税額を行に配分
  const taxTotal=Number(j.tax_total)||0;
  const items=lines.filter(l=>l.kind!=='shipping');
  let taxes=lines.map(l=>l.tax!=null&&isFinite(Number(l.tax))?Number(l.tax):(Number(l.tax_rate)>0?r2((Number(l.amount)||0)*Number(l.tax_rate)/100):0));
  const taxSum=r2(taxes.reduce((s,t)=>s+t,0));
  if(taxTotal&&Math.abs(taxSum-taxTotal)>0.05){
    if(taxSum>0&&Math.abs(taxSum-taxTotal)<=Math.max(1,taxTotal*0.01)){const k=taxes.findIndex(t=>t>0);taxes[k]=r2(taxes[k]+taxTotal-taxSum)}
    else{const base=items.reduce((s,l)=>s+(Number(l.amount)||0),0);taxes=lines.map(l=>l.kind!=='shipping'&&base?r2(taxTotal*(Number(l.amount)||0)/base):0);msgs.push('税額がどの行にかかるか分からないため、商品の金額の割合で配分しました')}
  }else if(!taxTotal&&taxSum>0){msgs.push('明細に税率がありますが、請求書の税額合計は0です。税額は含めていません');taxes=taxes.map(()=>0)}
  const total=Number(j.total);
  if(!isFinite(total))blockers.push('請求総額が読めませんでした');
  const v={key:'pdf|'+fileName,vid:'inv_'+hash(normName(supplier).toLowerCase()+'|'+(String(j.invoice_no||'').trim()||date)),date:date||'',supplier,no:String(j.invoice_no||'').trim(),
    doc:j.doc_type==='proforma'?'proforma':'invoice',currency:cur||'JPY',fx:cur==='JPY'?1:'',fxMode:'table',lines:[],extraFx:0,extraJpy:0,
    invoiceTotal:isFinite(total)?total:null,file:fileName,ai:true,notes:(Array.isArray(j.notes)?j.notes:[]).map(String),msgs,blockers};
  const smap=new Map(DB.supitems.map(x=>[x.id,x]));
  lines.forEach((l,i)=>{
    const amt=Number(l.amount)||0,tax=taxes[i]||0;
    if(l.kind==='shipping'){v.extraFx=r2(v.extraFx+amt+tax);return}
    const qty=Number(l.qty)||1;
    const sku=String(l.sku||'').trim(),desc=normName(l.description);
    const si=smap.get(supItemId(supplier,sku,desc));
    let label='',per=1,known=false,aiSuggest=false;
    if(si&&DB.products.some(p=>p.id===si.product_id)){label=prodLabel(DB.products.find(p=>p.id===si.product_id));per=si.per||1;known=true}
    else if(Number(l.product_no)>0&&DB.products[Number(l.product_no)-1]){label=prodLabel(DB.products[Number(l.product_no)-1]);aiSuggest=true}
    else if(l.product){const p=findProduct(l.product);if(p){label=prodLabel(p);aiSuggest=true}}
    v.lines.push({sku,desc,qty,unit:r2(amt/qty*10000)/10000,tax,label,per,known,aiSuggest});
  });
  if(!v.lines.length)blockers.push('商品の明細が見つかりませんでした');
  v.exists=DB.purchases.some(p=>p.voucher===v.vid);
  return v;
}
async function readPdfs(files){
  if(!files.length)return;
  if(aiState!=='ready'){toast('PDFの読み取りはここでは使えません','err');return}
  for(const f of files){
    const q={name:f.name,state:'run',msg:'PDFを開いています'};pdfQueue.push(q);refreshPdfZone();
    try{
      const {text,images}=await pdfToTextAndImages(f);
      if(aiMode==='claude'&&text.replace(/\[\d+ページ\]/g,'').trim().length<30&&!images.length){setPdfState(q,'error','文字を読み取れないPDFです（スキャン画像の可能性があります）');continue}
      setPdfState(q,'run','内容を読み取っています（30秒〜1分ほど）');
      let j;
      if(aiMode==='function'){j=await callInvoiceFunction(buildInvoicePrompt(text,'pdf'),f)}
      else{const opts={modelTier:'default'};if(images.length)opts.images=images;j=await aiSample.json(buildInvoicePrompt(text,images.length>0),opts)}
      const v=invoiceToVoucher(j||{},f.name);v.fileObj=f;
      if(!pimp)pimp={file:'請求書PDF',vouchers:[],errs:[]};
      pimp.vouchers=pimp.vouchers.filter(x=>x.vid!==v.vid);pimp.vouchers.push(v);
      setPdfState(q,'done',v.blockers.length?'読み取りました。確認が必要な点があります':'読み取りました。下で確認してください');
    }catch(e){
      const code=e&&e.code;
      const msg=code==='login_required'?'ログインし直してください':code==='no_api_key'?'サーバーにAnthropic APIキーが設定されていません':code==='too_large'?'PDFが大きすぎます（10MBまで）':code==='network'?'サーバーに接続できませんでした':code==='not_granted'||code==='sampling_disabled'?'Claudeの利用が許可されていないため読み取れません':code==='rate_limited'?'利用が混み合っています。少し時間をおいてからもう一度選んでください':code==='invalid_json'?'読み取り結果の形式が崩れました。もう一度選んでください':code==='image_rejected'?'ページ画像を送れませんでした':(e&&e.message)?'読み取れませんでした：'+e.message:'読み取れませんでした';
      setPdfState(q,'error',msg);
      if(code==='not_granted'||code==='sampling_disabled'){aiState='unavailable'}
    }
  }
  pdfQueue=pdfQueue.filter(q=>q.state!=='done');
  if(cur==='purchases'){if($('#vform'))readVoucher();if($('#pimp'))readPimp();render()}
}

async function exportJson(){
  const s=Object.assign({},settings);delete s.sbKey;
  const text=JSON.stringify({app:'arari-daicho',version:1,exportedAt:new Date().toISOString(),settings:s,data:DB});
  const filename=`粗利台帳_${isoLocal(new Date())}.json`;
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename,data:text});return}
  }catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function loadSample(){
  const R=mulberry32(20260916);
  const P=[['HA-FILL-1','ヒアルロン酸フィラー 1ml','注入剤',17500,3900],['PDO-19G','PDO糸 19G 100mm（10本）','糸',52000,9800],['PEEL-30','ピーリング剤 30ml','ピーリング',21000,2650],['BTX-100','ボツリヌス製剤 100単位','注入剤',38000,7400],['SKB-5','スキンブースター 2ml×5本','注入剤',61000,11800]]
    .map(([code,name,category,krw,sell])=>({id:uid(),code:'SMP-'+code,name,category,memo:'サンプル',krw,sell}));
  const S=[['韓国ブローカーA（サンプル）',1.0,'KRW'],['韓国ブローカーB（サンプル）',0.93,'KRW'],['韓国ブローカーC（サンプル）',1.06,'KRW'],['国内卸D（サンプル）',1.18,'JPY']].map(([name,f,cur])=>({id:uid(),name,memo:'',f,cur}));
  const custs=['Aクリニック','B美容皮膚科','Cスキンクリニック','D形成外科','E医院','Fクリニック','G美容外科','Hクリニック'];
  const purchases=[],sales=[];const now=new Date();
  for(let mo=-6;mo<=0;mo++){
    const maxDay=mo===0?Math.max(1,now.getDate()):28;
    const day=dd=>isoLocal(new Date(now.getFullYear(),now.getMonth()+mo,Math.min(dd,maxDay)));
    const plan=mo===-6?[[0,1,P.map(()=>1)]]:[[mo%2===0?0:1,3,null],[R()<.5?2:3,12,null]];
    for(const [si,dd,forced] of plan){
      const s=S[si];const vid=uid();const fx=s.cur==='KRW'?0.104+R()*0.008:1;
      const chosen=forced?P:P.filter(()=>R()<.6);if(!chosen.length)chosen.push(P[0]);
      const extra=s.cur==='KRW'?Math.round(5000+R()*9000):0;
      const lines=chosen.map(p=>{const qty=(forced?40:10+Math.floor(R()*30));const base=p.krw*s.f*(0.96+R()*0.08);const unit=s.cur==='KRW'?Math.round(base/10)*10:Math.round(base*0.108);return{p,qty,unit}});
      const total=lines.reduce((t,l)=>t+l.qty*l.unit*fx,0);
      lines.forEach(l=>purchases.push({id:uid(),voucher:vid,date:day(dd),supplier_id:s.id,no:`SMP-${mo+7}-${si}`,currency:s.cur,fx:Number(fx.toFixed(4)),product_id:l.p.id,qty:l.qty,unit_price:l.unit,extra:extra*(l.qty*l.unit*fx)/total,memo:'サンプル'}));
    }
    const nSales=mo===0?Math.max(3,Math.round(30*maxDay/28)):30;
    for(let k=0;k<nSales;k++){
      const p=P[Math.floor(R()*P.length)];const qty=1+Math.floor(R()*8);const unit=Math.round(p.sell*(0.92+R()*0.14)/10)*10;
      const dd=mo===-6?2+Math.floor(R()*26):1+Math.floor(R()*maxDay);
      sales.push({id:'smp_'+uid(),batch:'sample',date:day(dd),orderNo:`SMP${mo+7}${String(k).padStart(3,'0')}`,customer:custs[Math.floor(R()*custs.length)],code:p.code,name:p.name,qty,unit,amount:unit*qty});
    }
    sales.push({id:'smp_'+uid(),batch:'sample',date:day(15),orderNo:`SMP${mo+7}SHIP`,customer:custs[0],code:'SHIP',name:'送料',qty:1,unit:1100,amount:1100});
  }
  await save('products',P.map(({krw,sell,...p})=>p));
  await save('suppliers',S.map(({f,cur,...s})=>s));
  await save('purchases',purchases);
  await save('batches',{id:'sample',file:'サンプルデータ',importedAt:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,19),rows:sales.length,from:sales.reduce((m,s)=>s.date<m?s.date:m,'9999'),to:sales.reduce((m,s)=>s.date>m?s.date:m,'')});
  await save('sales',sales);
}

/* ========== 起動 ========== */
function renderLogin(msg){
  $('#tabs').innerHTML='';$('#storeBadge').textContent='';$('#banner').innerHTML='';
  $('#view').innerHTML=`<section class="card" style="max-width:420px;margin:8vh auto">
    <h2>ログイン</h2><p class="hint">登録されたメールアドレスとパスワードでログインしてください。</p>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:.7rem;margin-top:.8rem">
      <label class="field"><span>メールアドレス</span><input type="email" id="lgEmail" autocomplete="username" required></label>
      <label class="field"><span>パスワード</span><input type="password" id="lgPass" autocomplete="current-password" required></label>
      ${msg?`<div class="note warn">${esc(msg)}</div>`:''}
      <button class="btn primary" type="submit" id="lgBtn">ログイン</button>
    </form></section>`;
  $('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#lgBtn');b.disabled=true;b.textContent='確認しています…';
    const{error}=await RemoteBackend.client.auth.signInWithPassword({email:$('#lgEmail').value.trim(),password:$('#lgPass').value});
    if(error){renderLogin(/invalid/i.test(error.message)?'メールアドレスかパスワードが違います':'ログインできませんでした：'+error.message);return}
    startApp()};
  $('#lgEmail').focus();
}
async function logout(){try{await RemoteBackend.client.auth.signOut()}catch(e){}location.reload()}
async function startApp(){
  if(SERVER_MODE){
    if(!window.supabase){$('#view').innerHTML='<div class="banner">Supabaseのライブラリを読み込めませんでした。ネットワークを確認して再読み込みしてください。</div>';return}
    if(!RemoteBackend.client)RemoteBackend.init(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseAnonKey,true);
    const{data}=await RemoteBackend.client.auth.getSession();
    if(!data||!data.session){renderLogin();return}
    authUser=data.session.user;
  }
  $('#view').innerHTML='<p class="hint">データを読み込んでいます…</p>';
  await initBackend();await loadAll();render();
}
startApp();
</script>
